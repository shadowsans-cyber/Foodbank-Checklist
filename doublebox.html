<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Double Box">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f0;
    --ink: #1a1a18;
    --mid: #5a5550;
    --accent: #c0392b;
    --accent-light: #f9ebe9;
    --line: #e0d8ce;
    --checked-bg: #f0ede8;
    --green: #27ae60;
  }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    border-top: 3px solid var(--ink);
    border-bottom: 1px solid var(--line);
    padding: 1.4rem 0 1.2rem;
    margin-bottom: 2rem;
  }

  .label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink);
  }

  .progress-bar {
    margin-top: 1rem;
    background: var(--line);
    border-radius: 2px;
    height: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-text {
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--mid);
    display: flex;
    justify-content: space-between;
  }

  .section-title {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
    padding: 0.5rem 0 0.4rem;
    margin-top: 1.4rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 0.2rem;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.7rem 0.5rem;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 3px;
    user-select: none;
  }

  .item:hover { background: var(--warm-white); }
  .item.checked { background: var(--checked-bg); }
  .item.checked .item-name { text-decoration: line-through; color: #aaa9a6; }
  .item.checked .item-qty { color: #bbb; }

  .checkbox {
    width: 20px;
    height: 20px;
    border: 1.5px solid #bbb0a6;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    background: white;
  }

  .item.checked .checkbox {
    background: var(--green);
    border-color: var(--green);
  }

  .checkmark {
    display: none;
    width: 11px;
    height: 7px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(-45deg) translateY(-1px);
  }

  .item.checked .checkmark { display: block; }

  .item-text { flex: 1; }
  .item-name { font-size: 0.95rem; font-weight: 500; }
  .item-qty { font-size: 0.78rem; color: var(--mid); margin-top: 0.05rem; }

  .reset-btn {
    margin-top: 2.5rem;
    display: block;
    width: 100%;
    padding: 0.85rem;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mid);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .complete-banner {
    display: none;
    background: var(--green);
    color: white;
    text-align: center;
    padding: 1rem;
    border-radius: 4px;
    margin-top: 1.5rem;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
  }

  @media print {
    .reset-btn, .progress-bar, .progress-text { display: none; }
    body { background: white; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="label">Foodbank</div>
    <h1>Double Box Checklist</h1>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-text">
      <span id="count-text">0 of 33 items checked</span>
      <span id="pct-text">0%</span>
    </div>
  </header>

  <div id="list"></div>

  <div class="complete-banner" id="banner">✓ Box complete — all items packed!</div>
  <button class="reset-btn" onclick="resetAll()">Reset Checklist</button>
</div>

<script>
const sections = [
  {
    title: "Tins & Jars",
    items: [
      { name: "Soup", qty: "4 × 400g" },
      { name: "Tinned Tomatoes", qty: "4 × 400g" },
      { name: "Baked Beans", qty: "4 × 400g" },
      { name: "Tinned Spaghetti", qty: "2 × 400g" },
      { name: "Rice Pudding", qty: "1 × 400g" },
      { name: "Custard", qty: "1 × 400g" },
      { name: "Tinned Fruit", qty: "2 tins" },
      { name: "Tinned Veg", qty: "4 tins" },
      { name: "Tinned Meat", qty: "3 tins" },
      { name: "Fish", qty: "4 tins" },
      { name: "Jam / Spread", qty: "2 jars" },
    ]
  },
  {
    title: "Dry & Ambient",
    items: [
      { name: "Rice", qty: "1 × packet" },
      { name: "Lentils", qty: "1 × packet" },
      { name: "Pasta", qty: "3 × 500g" },
      { name: "Porridge", qty: "1 × packet" },
      { name: "Pasta / Curry Sauces", qty: "1 of each" },
      { name: "Instant Mash", qty: "1" },
      { name: "Cereal", qty: "1 × packet" },
      { name: "Sugar", qty: "500g" },
    ]
  },
  {
    title: "Drinks",
    items: [
      { name: "Coffee", qty: "1 jar" },
      { name: "Tea", qty: "1 × 80 bags" },
      { name: "Juice", qty: "1 litre" },
      { name: "Milk", qty: "1 litre" },
    ]
  },
  {
    title: "Treats & Snacks",
    items: [
      { name: "Sponge Pudding", qty: "1" },
      { name: "Snacks", qty: "1 × packet" },
      { name: "Chocolate", qty: "1 × bar" },
      { name: "Biscuits", qty: "1 × packet" },
    ]
  },
  {
    title: "Condiments & Cooking",
    items: [
      { name: "Oil", qty: "1 litre" },
      { name: "Ketchup / Brown Sauce", qty: "1" },
      { name: "Condiments", qty: "1" },
    ]
  },
  {
    title: "As Required",
    items: [
      { name: "Toiletries", qty: "As required" },
      { name: "Household Items", qty: "As required" },
      { name: "Pet Food", qty: "As required" },
    ]
  }
];

const state = {};
let total = 0;

sections.forEach(s => s.items.forEach((item, i) => {
  const id = s.title + '-' + i;
  state[id] = false;
  total++;
}));

document.getElementById('count-text').textContent = `0 of ${total} items checked`;

function render() {
  const container = document.getElementById('list');
  container.innerHTML = '';
  sections.forEach(section => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = section.title;
    container.appendChild(title);

    section.items.forEach((item, i) => {
      const id = section.title + '-' + i;
      const div = document.createElement('div');
      div.className = 'item' + (state[id] ? ' checked' : '');
      div.innerHTML = `
        <div class="checkbox"><div class="checkmark"></div></div>
        <div class="item-text">
          <div class="item-name">${item.name}</div>
          <div class="item-qty">${item.qty}</div>
        </div>`;
      div.onclick = () => toggle(id);
      container.appendChild(div);
    });
  });
  updateProgress();
}

function toggle(id) {
  state[id] = !state[id];
  render();
}

function updateProgress() {
  const checked = Object.values(state).filter(Boolean).length;
  const pct = Math.round((checked / total) * 100);
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('count-text').textContent = `${checked} of ${total} items checked`;
  document.getElementById('pct-text').textContent = pct + '%';
  document.getElementById('banner').style.display = checked === total ? 'block' : 'none';
}

function resetAll() {
  Object.keys(state).forEach(k => state[k] = false);
  render();
}

render();
</script>
</body>
</html>
